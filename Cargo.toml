[package]
name = "wam"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Wayland app monitor is a picture-in-picture utility"

[dependencies]
ab_glyph = "0.2"
fontconfig = { version = "0.11", features = ["dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }

[profile.release]
strip = true